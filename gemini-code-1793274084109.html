<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>골목픽 - 우리 동네 맛집 AI 추천</title>
    <!-- React & Tailwind CSS CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/30 text-gray-800 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function GolmokPickApp() {
            // 회원가입/로그인 상태
            const [currentUser, setCurrentUser] = useState(null); // { id, nickname, points, mode }
            const [authMode, setAuthMode] = useState('LOGIN'); // 'LOGIN' | 'REGISTER'
            const [loginId, setLoginId] = useState('');
            const [loginPw, setLoginPw] = useState('');
            const [regNickname, setRegNickname] = useState('');

            // 앱 내부 상태
            const [isAdminView, setIsAdminView] = useState(false);
            const [adminPasswordInput, setAdminPasswordInput] = useState('');
            const [adminAuthed, setAdminAuthed] = useState(false);

            // 가상 DB (테스트용)
            const [userList, setUserList] = useState([
                { id: 'user1', nickname: '대동주민123', points: 320, reviewCount: 3, mode: 'RESIDENT' },
                { id: 'user2', nickname: '영남대식객', points: 550, reviewCount: 5, mode: 'RESIDENT' },
                { id: 'user3', nickname: '여행가김씨', points: 120, reviewCount: 1, mode: 'TRAVELER' }
            ]);

            // 로그인 처리
            const handleLogin = (e) => {
                e.preventDefault();
                if (!loginId || !loginPw) {
                    alert("아이디와 비밀번호를 입력해주세요.");
                    return;
                }
                
                // 기존 유저 찾기 또는 새로 로그인 세션 생성
                const existing = userList.find(u => u.id === loginId);
                if (existing) {
                    setCurrentUser(existing);
                } else {
                    const newUser = { id: loginId, nickname: loginId, points: 0, reviewCount: 0, mode: 'RESIDENT' };
                    setUserList(prev => [...prev, newUser]);
                    setCurrentUser(newUser);
                }
            };

            // 회원가입 처리
            const handleRegister = (e) => {
                e.preventDefault();
                if (!loginId || !loginPw || !regNickname) {
                    alert("모든 항목을 입력해주세요.");
                    return;
                }
                const newUser = { id: loginId, nickname: regNickname, points: 0, reviewCount: 0, mode: 'RESIDENT' };
                setUserList(prev => [...prev, newUser]);
                setCurrentUser(newUser);
                alert("회원가입이 완료되어 로그인되었습니다!");
            };

            // 리뷰 작성 시 포인트 증가
            const handleAddReview = () => {
                if (!currentUser) return;
                const updatedPoints = currentUser.points + 100;
                const updatedReviews = currentUser.reviewCount + 1;
                
                const updatedUser = { ...currentUser, points: updatedPoints, reviewCount: updatedReviews };
                setCurrentUser(updatedUser);
                
                setUserList(prev => prev.map(u => u.id === currentUser.id ? updatedUser : u));
                alert("영수증 인증 리뷰가 정상 등록되어 100P가 적립되었습니다!");
            };

            // 관리자 로그인 확인
            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (adminPasswordInput === 'admin1234') { // 관리자 비밀번호
                    setAdminAuthed(true);
                } else {
                    alert("관리자 비밀번호가 올바르지 않습니다.");
                }
            };

            // 1. 로그인/회원가입 화면
            if (!currentUser && !isAdminView) {
                return (
                    <div class="min-h-screen flex flex-col items-center justify-center p-6 bg-[#FFFBF0]">
                        <div class="w-full max-w-sm bg-white p-6 rounded-3xl shadow-xl border border-orange-100 text-center">
                            <div class="w-20 h-20 mx-auto mb-3 bg-orange-500 rounded-full flex items-center justify-center text-white text-3xl font-bold shadow-md">
                                📍
                            </div>
                            <h1 class="text-2xl font-black text-orange-600 mb-1">골목픽</h1>
                            <p class="text-xs text-gray-500 mb-6">기기가 바뀌어도 포인트 보존! 로그인해주세요.</p>

                            {authMode === 'LOGIN' ? (
                                <form onSubmit={handleLogin} class="space-y-3">
                                    <input 
                                        type="text" 
                                        placeholder="아이디 (휴대폰 번호 등)" 
                                        value={loginId}
                                        onChange={(e) => setLoginId(e.target.value)}
                                        class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-orange-500"
                                    />
                                    <input 
                                        type="password" 
                                        placeholder="비밀번호" 
                                        value={loginPw}
                                        onChange={(e) => setLoginPw(e.target.value)}
                                        class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-orange-500"
                                    />
                                    <button type="submit" class="w-full py-3.5 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl shadow transition-all text-sm">
                                        로그인하기
                                    </button>
                                    <button 
                                        type="button" 
                                        onClick={() => setAuthMode('REGISTER')}
                                        class="text-xs text-gray-400 underline block mx-auto mt-2">
                                        계정이 없으신가요? 회원가입
                                    </button>
                                </form>
                            ) : (
                                <form onSubmit={handleRegister} class="space-y-3">
                                    <input 
                                        type="text" 
                                        placeholder="사용할 아이디" 
                                        value={loginId}
                                        onChange={(e) => setLoginId(e.target.value)}
                                        class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-orange-500"
                                    />
                                    <input 
                                        type="password" 
                                        placeholder="비밀번호" 
                                        value={loginPw}
                                        onChange={(e) => setLoginPw(e.target.value)}
                                        class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-orange-500"
                                    />
                                    <input 
                                        type="text" 
                                        placeholder="동네 닉네임 (예: 대동주민)" 
                                        value={regNickname}
                                        onChange={(e) => setRegNickname(e.target.value)}
                                        class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-orange-500"
                                    />
                                    <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow transition-all text-sm">
                                        회원가입 완료
                                    </button>
                                    <button 
                                        type="button" 
                                        onClick={() => setAuthMode('LOGIN')}
                                        class="text-xs text-gray-400 underline block mx-auto mt-2">
                                        이미 계정이 있으신가요? 로그인
                                    </button>
                                </form>
                            )}

                            <hr class="my-5 border-gray-100" />
                            <button 
                                onClick={() => setIsAdminView(true)}
                                class="text-xs bg-gray-100 text-gray-600 px-3 py-1.5 rounded-lg font-bold hover:bg-gray-200">
                                🔒 관계자(관리자) 전용 접속
                            </button>
                        </div>
                    </div>
                );
            }

            // 2. 관리자(관계자) 전용 모드
            if (isAdminView) {
                return (
                    <div class="max-w-md mx-auto bg-white min-h-screen p-5 border-x border-gray-100">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-xl font-extrabold text-gray-900">👑 관계자 관리자 페이지</h2>
                            <button 
                                onClick={() => { setIsAdminView(false); setAdminAuthed(false); }}
                                class="text-xs bg-gray-200 text-gray-700 px-3 py-1 rounded-lg">
                                나가기
                            </button>
                        </div>

                        {!adminAuthed ? (
                            <form onSubmit={handleAdminLogin} class="bg-gray-50 p-5 rounded-2xl border border-gray-200 space-y-3">
                                <p class="text-sm font-bold text-gray-700">관리자 비밀번호를 입력하세요.</p>
                                <input 
                                    type="password" 
                                    placeholder="비밀번호 (초기값: admin1234)" 
                                    value={adminPasswordInput}
                                    onChange={(e) => setAdminPasswordInput(e.target.value)}
                                    class="w-full px-4 py-2.5 border rounded-xl text-sm"
                                />
                                <button type="submit" class="w-full py-2.5 bg-gray-900 text-white font-bold rounded-xl text-sm">
                                    관리자 인증
                                </button>
                            </form>
                        ) : (
                            <div>
                                <div class="bg-orange-50 border border-orange-200 p-4 rounded-2xl mb-5 text-xs text-orange-900">
                                    💡 <strong>기프티콘 지급 관리:</strong> 리뷰 작성 수가 많거나 포인트를 많이 적립한 열심 주민 유저를 파악하고 기프티콘을 발송하세요.
                                </div>

                                <h3 class="font-bold text-sm text-gray-700 mb-3">📊 회원별 활동 현황 목록</h3>
                                <div class="space-y-3">
                                    {userList.map((u, i) => (
                                        <div key={i} class="p-4 border rounded-2xl flex justify-between items-center bg-gray-50/50">
                                            <div>
                                                <div class="flex items-center gap-2">
                                                    <span class="font-bold text-gray-800 text-sm">{u.nickname}</span>
                                                    <span class="text-[10px] bg-gray-200 px-1.5 py-0.5 rounded text-gray-600">{u.id}</span>
                                                </div>
                                                <p class="text-xs text-gray-500 mt-1">
                                                    작성 리뷰: <strong class="text-orange-600">{u.reviewCount}개</strong>
                                                </p>
                                            </div>
                                            <div class="text-right">
                                                <span class="text-xs text-gray-400 block">보유 포인트</span>
                                                <span class="font-extrabold text-orange-600 text-sm">{u.points} P</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // 3. 일반 사용자 메인 화면
            return (
                <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl flex flex-col relative pb-20 border-x border-gray-100">
                    <header class="p-4 bg-[#FFFBF0] border-b border-orange-100 flex items-center justify-between sticky top-0 z-10">
                        <div class="flex items-center gap-2">
                            <span class="text-2xl font-black text-orange-500">골목픽</span>
                            <span class="text-xs bg-orange-100 text-orange-700 font-bold px-2 py-0.5 rounded-full">
                                {currentUser.nickname}님
                            </span>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="text-right">
                                <span class="text-[10px] text-gray-400 block">내 포인트</span>
                                <span class="font-extrabold text-orange-600 text-sm">{currentUser.points.toLocaleString()} P</span>
                            </div>
                            <button onClick={() => setCurrentUser(null)} class="text-xs text-gray-400 underline">로그아웃</button>
                        </div>
                    </header>

                    <div class="bg-amber-100/70 px-4 py-2 text-xs text-amber-800 flex items-center justify-between">
                        <span>💡 1,000P = 1,000원 (상점 협찬 없이 100% 주민 리뷰)</span>
                    </div>

                    <main class="p-4 flex-1">
                        <div class="bg-orange-50 p-4 rounded-2xl mb-6 border border-orange-100 text-center">
                            <h2 class="font-bold text-gray-800 text-lg mb-1">📍 내 위치 반경 20km 찐맛집</h2>
                            <p class="text-xs text-gray-500">실제 영수증 인증 리뷰 작성 시 100P 적립!</p>
                        </div>

                        <div class="space-y-4">
                            <div class="border border-gray-100 rounded-2xl p-4 shadow-sm">
                                <div class="flex justify-between items-center mb-3">
                                    <h3 class="font-bold text-base text-gray-800">💬 동네 주민 영수증 리뷰</h3>
                                    <button 
                                        onClick={handleAddReview}
                                        class="text-xs bg-orange-500 text-white font-bold px-3 py-1.5 rounded-lg hover:bg-orange-600">
                                        + 영수증 리뷰 작성 (+100P)
                                    </button>
                                </div>
                                
                                <div class="bg-gray-50 p-3 rounded-xl border border-gray-100">
                                    <div class="flex justify-between text-xs text-gray-500 mb-1">
                                        <span class="font-bold text-gray-700">{currentUser.nickname} (영수증 인증 완료)</span>
                                        <span>방금 전</span>
                                    </div>
                                    <p class="text-sm text-gray-800 font-medium mb-2">
                                        "상점 협찬 없이 내 돈 주고 먹은 찐맛집입니다! 양도 푸짐해요."
                                    </p>
                                </div>
                            </div>
                        </div>
                    </main>

                    <nav class="fixed bottom-0 max-w-md w-full bg-white border-t border-gray-100 py-3 flex justify-around text-xs font-bold text-gray-500">
                        <button class="text-orange-500 flex flex-col items-center"><span>🏠</span> 홈</button>
                        <button class="flex flex-col items-center"><span>🗺️</span> 20km 지도</button>
                        <button class="flex flex-col items-center"><span>✨</span> AI 추천</button>
                        <button onClick={() => setIsAdminView(true)} class="flex flex-col items-center text-gray-400"><span>🔒</span> 관계자</button>
                    </nav>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<GolmokPickApp />);
    </script>
</body>
</html>
